<!doctype html>
<!--
  Unofficial reconstruction of the Sora 2 web interface (sora.chatgpt.com), built from memory
  and public descriptions. No original markup, CSS, fonts, artwork or video was recovered or used.
  All usernames, captions and "videos" are invented placeholders. Not affiliated with OpenAI.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sora 2 UI reconstruction</title>
<style>
  :root {
    --bg: #000;
    --surface: #111;
    --surface-2: #1a1a1a;
    --surface-3: #262626;
    --line: rgba(255,255,255,.1);
    --text: #fff;
    --muted: rgba(255,255,255,.6);
    --faint: rgba(255,255,255,.38);
    --like: #ff3b5c;
    --rail: 72px;
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text); overflow: hidden;
    font: 15px/1.4 "OpenAI Sans", ui-sans-serif, -apple-system, "SF Pro Text", "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, [tabindex]:focus-visible, textarea:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- left rail ---------- */
  .rail {
    position: fixed; inset: 0 auto 0 0; width: var(--rail); z-index: 30;
    display: flex; flex-direction: column; align-items: center; padding: 18px 0 16px; gap: 6px;
  }
  .logo { width: 36px; height: 36px; margin-bottom: 18px; }
  .logo svg { width: 36px; height: 36px; stroke: none; }
  .nav { display: flex; flex-direction: column; gap: 6px; flex: 1; justify-content: center; }
  .nav button, .rail-foot button {
    width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center;
    color: var(--muted); position: relative; transition: background .15s, color .15s;
  }
  .nav button:hover, .rail-foot button:hover { background: var(--surface-2); color: var(--text); }
  .nav button[aria-current="page"] { color: var(--text); }
  .nav button[aria-current="page"] svg { stroke-width: 2.3; }
  .nav button::after, .rail-foot button::after {
    content: attr(data-tip); position: absolute; left: 56px; top: 50%; translate: 0 -50%;
    background: var(--surface-3); color: var(--text); font-size: 12.5px; padding: 5px 9px; border-radius: 8px;
    white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s;
  }
  .nav button:hover::after, .rail-foot button:hover::after { opacity: 1; }
  .dot { position: absolute; top: 10px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--like); border: 2px solid var(--bg); box-sizing: content-box; }
  .avatar { border-radius: 50%; display: grid; place-items: center; font-weight: 600; color: #000; flex: none; }

  /* ---------- views ---------- */
  main { position: fixed; inset: 0 0 0 var(--rail); }
  .view { position: absolute; inset: 0; display: none; }
  .view.on { display: block; }
  .scroll { height: 100%; overflow-y: auto; padding: 0 28px 170px; scrollbar-width: thin; scrollbar-color: #333 transparent; }
  .page-head { position: sticky; top: 0; z-index: 5; padding: 22px 0 14px; background: linear-gradient(#000 70%, transparent); display: flex; align-items: center; gap: 12px; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -.01em; }

  /* ---------- feed ---------- */
  .feed-switch {
    position: absolute; top: 16px; left: 50%; translate: -50% 0; z-index: 10;
  }
  .pill-btn {
    display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 999px;
    background: rgba(30,30,30,.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    font-weight: 600; font-size: 14.5px; border: 1px solid var(--line);
  }
  .pill-btn svg { width: 16px; height: 16px; }
  .menu {
    position: absolute; min-width: 190px; padding: 6px; border-radius: 16px; background: rgba(32,32,32,.96);
    border: 1px solid var(--line); box-shadow: 0 16px 48px rgba(0,0,0,.6); z-index: 50;
    opacity: 0; pointer-events: none; transform: translateY(-4px) scale(.98); transition: .14s var(--ease);
  }
  .menu.open { opacity: 1; pointer-events: auto; transform: none; }
  .menu button { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 12px; border-radius: 10px; font-size: 14.5px; text-align: left; }
  .menu button:hover { background: rgba(255,255,255,.08); }
  .menu button svg { width: 16px; height: 16px; opacity: 0; }
  .menu button[aria-checked="true"] svg { opacity: 1; }
  .feed-switch .menu { top: 46px; left: 50%; margin-left: -95px; }

  .feed { height: 100%; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; }
  .feed::-webkit-scrollbar { display: none; }
  .slide { height: 100%; scroll-snap-align: start; scroll-snap-stop: always; display: flex; align-items: center; justify-content: center; gap: 18px; padding: 68px 16px 132px; }
  .player {
    height: 100%; max-height: 860px; aspect-ratio: 9/16; max-width: calc(100vw - var(--rail) - 110px);
    border-radius: 22px; overflow: hidden; position: relative; background: #0b0b0b; isolation: isolate; cursor: pointer;
  }
  .scene { position: absolute; inset: -20%; filter: blur(28px) saturate(1.25); animation: drift 14s ease-in-out infinite alternate; }
  .scene i { position: absolute; border-radius: 50%; mix-blend-mode: screen; animation: orbit 11s ease-in-out infinite alternate; }
  .scene i:nth-child(1) { width: 70%; height: 55%; left: 0; top: 5%; }
  .scene i:nth-child(2) { width: 60%; height: 60%; right: -5%; top: 30%; animation-duration: 15s; animation-direction: alternate-reverse; }
  .scene i:nth-child(3) { width: 80%; height: 50%; left: 10%; bottom: -5%; animation-duration: 19s; }
  .paused .scene, .paused .scene i { animation-play-state: paused; }
  @keyframes drift { to { transform: rotate(8deg) scale(1.12); } }
  @keyframes orbit { to { transform: translate(14%, -12%) scale(1.25); } }
  .grain { position: absolute; inset: 0; background: radial-gradient(transparent 50%, rgba(0,0,0,.35)); z-index: 1; }
  .shade { position: absolute; inset: auto 0 0; height: 46%; background: linear-gradient(transparent, rgba(0,0,0,.72)); z-index: 2; }
  .play-ind { position: absolute; inset: 0; display: grid; place-items: center; z-index: 3; opacity: 0; transition: opacity .15s; pointer-events: none; }
  .play-ind span { width: 76px; height: 76px; border-radius: 50%; background: rgba(0,0,0,.45); backdrop-filter: blur(10px); display: grid; place-items: center; }
  .play-ind svg { width: 32px; height: 32px; fill: #fff; stroke: none; }
  .paused .play-ind { opacity: 1; }
  .meta { position: absolute; inset: auto 0 0; padding: 18px 18px 20px; z-index: 4; }
  .who { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .who b { font-weight: 600; font-size: 15px; }
  .follow { margin-left: 4px; height: 28px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.55); font-size: 13px; font-weight: 600; }
  .follow.on { border-color: transparent; background: rgba(255,255,255,.16); color: var(--muted); }
  .caption { font-size: 14.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-shadow: 0 1px 8px rgba(0,0,0,.5); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 4px; border-radius: 999px; background: rgba(255,255,255,.16); backdrop-filter: blur(12px); font-size: 12.5px; font-weight: 500; }
  .chip .avatar { width: 18px; height: 18px; font-size: 10px; }
  .progress { position: absolute; inset: auto 0 0; height: 3px; background: rgba(255,255,255,.2); z-index: 5; }
  .progress i { display: block; height: 100%; width: 0; background: #fff; }
  .slide.active .progress i { animation: bar 10s linear infinite; }
  .slide.active .paused .progress i { animation-play-state: paused; }
  @keyframes bar { to { width: 100%; } }

  .actions { display: flex; flex-direction: column; gap: 14px; align-self: flex-end; padding-bottom: 8px; }
  .act { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 500; color: var(--muted); }
  .act span { width: 48px; height: 48px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; color: var(--text); transition: transform .15s var(--ease), background .15s; }
  .act:hover span { background: var(--surface-3); }
  .act:active span { transform: scale(.9); }
  .act.liked span { color: var(--like); }
  .act.liked svg { fill: var(--like); animation: pop .35s var(--ease); }
  @keyframes pop { 40% { transform: scale(1.35); } }
  .stepper { position: absolute; right: 22px; top: 50%; translate: 0 -50%; display: flex; flex-direction: column; gap: 10px; z-index: 6; }
  .stepper button { width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; }
  .stepper button:hover { background: var(--surface-3); }
  .stepper button:disabled { opacity: .3; cursor: default; }

  /* ---------- grids (explore / drafts / profile) ---------- */
  .tabs { display: flex; gap: 6px; }
  .tab { height: 34px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--muted); }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { background: #fff; color: #000; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; }
  .tile { position: relative; aspect-ratio: 9/16; border-radius: 12px; overflow: hidden; background: #0b0b0b; cursor: pointer; isolation: isolate; }
  .tile .scene { animation-play-state: paused; }
  .tile .scene i { animation-play-state: paused; }
  .tile:hover .scene, .tile:hover .scene i { animation-play-state: running; }
  .tile-meta { position: absolute; inset: auto 0 0; padding: 26px 10px 10px; z-index: 3; background: linear-gradient(transparent, rgba(0,0,0,.7)); font-size: 12.5px; display: flex; align-items: center; gap: 6px; font-weight: 500; }
  .tile-meta .avatar { width: 20px; height: 20px; font-size: 10px; }
  .tile-meta em { margin-left: auto; font-style: normal; display: inline-flex; align-items: center; gap: 3px; color: rgba(255,255,255,.85); }
  .tile-meta em svg { width: 13px; height: 13px; }
  .tile .badge { position: absolute; top: 8px; left: 8px; z-index: 3; font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: rgba(0,0,0,.55); backdrop-filter: blur(10px); }
  .tile.gen { cursor: default; background: #101010; display: grid; place-items: center; }
  .tile.gen::before { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.07) 50%, transparent 70%); background-size: 250% 100%; animation: sheen 1.8s linear infinite; }
  @keyframes sheen { from { background-position: 120% 0; } to { background-position: -130% 0; } }
  .ring { position: relative; width: 62px; height: 62px; display: grid; place-items: center; font-size: 13px; font-weight: 600; }
  .ring svg { position: absolute; inset: 0; width: 62px; height: 62px; rotate: -90deg; stroke-width: 3; }
  .ring circle:first-child { stroke: rgba(255,255,255,.14); }
  .ring circle:last-child { stroke: #fff; transition: stroke-dashoffset .4s linear; }
  .gen p { position: absolute; inset: auto 12px 12px; font-size: 12.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .empty { color: var(--muted); padding: 60px 0; text-align: center; }

  .search { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 16px; border-radius: 999px; background: var(--surface-2); max-width: 560px; flex: 1; }
  .search input { flex: 1; background: none; border: 0; outline: 0; color: var(--text); font: inherit; }
  .search input::placeholder { color: var(--faint); }
  .search svg { width: 18px; height: 18px; color: var(--muted); }

  .profile-top { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 56px 0 22px; text-align: center; }
  .profile-top .avatar { width: 96px; height: 96px; font-size: 36px; }
  .profile-top h1 { font-size: 20px; }
  .profile-top p { color: var(--muted); max-width: 380px; }
  .stats { display: flex; gap: 28px; margin: 6px 0; }
  .stats div { font-size: 13px; color: var(--muted); }
  .stats b { display: block; color: var(--text); font-size: 17px; font-weight: 600; }
  .btn { height: 38px; padding: 0 16px; border-radius: 999px; background: var(--surface-2); font-weight: 600; font-size: 14px; }
  .btn:hover { background: var(--surface-3); }
  .btn.primary { background: #fff; color: #000; }
  .btn.primary:hover { background: #e5e5e5; }
  .center { display: flex; justify-content: center; margin-bottom: 14px; }

  .notif { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); max-width: 640px; }
  .notif .avatar { width: 40px; height: 40px; }
  .notif p { flex: 1; font-size: 14.5px; }
  .notif p span { color: var(--faint); }
  .notif .thumb { width: 40px; height: 56px; border-radius: 8px; position: relative; overflow: hidden; }

  /* ---------- composer ---------- */
  .composer-wrap { position: fixed; left: var(--rail); right: 0; bottom: 20px; z-index: 40; display: flex; justify-content: center; padding: 0 16px; pointer-events: none; }
  .composer {
    pointer-events: auto; width: min(680px, 100%); border-radius: 28px; padding: 12px 12px 10px;
    background: rgba(28,28,28,.82); backdrop-filter: blur(30px) saturate(1.4); -webkit-backdrop-filter: blur(30px) saturate(1.4);
    border: 1px solid var(--line); box-shadow: 0 12px 40px rgba(0,0,0,.55); position: relative;
  }
  .composer textarea { display: block; width: 100%; resize: none; background: none; border: 0; outline: 0; color: var(--text); font: inherit; font-size: 16px; padding: 4px 8px 8px; max-height: 140px; }
  .composer textarea::placeholder { color: var(--faint); }
  .c-row { display: flex; align-items: center; gap: 6px; }
  .c-btn { height: 36px; min-width: 36px; padding: 0 9px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--muted); font-size: 13.5px; font-weight: 500; }
  .c-btn:hover { background: rgba(255,255,255,.09); color: var(--text); }
  .c-btn { white-space: nowrap; }
  .c-btn svg { width: 20px; height: 20px; }
  .c-btn.outlined { border: 1px solid var(--line); padding: 0 12px; }
  .c-btn .pro { font-size: 10px; font-weight: 700; letter-spacing: .04em; padding: 1px 5px; border-radius: 5px; background: rgba(255,255,255,.14); color: var(--text); }
  .send { margin-left: auto; width: 36px; height: 36px; border-radius: 50%; background: #fff; color: #000; display: grid; place-items: center; transition: opacity .15s, transform .15s var(--ease); }
  .send:disabled { opacity: .25; cursor: default; }
  .send:not(:disabled):active { transform: scale(.9); }
  .send svg { width: 20px; height: 20px; stroke-width: 2.4; }
  .cameo-row { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 6px 8px; }
  .cameo-row:empty { display: none; }
  .cameo-row .chip { padding-right: 6px; background: rgba(255,255,255,.1); }
  .cameo-row .chip button { width: 16px; height: 16px; display: grid; place-items: center; color: var(--muted); }
  .cameo-row .chip svg { width: 12px; height: 12px; }
  .composer .menu { bottom: 58px; left: 8px; transform: translateY(4px) scale(.98); }
  .composer .menu.open { transform: none; }
  #settingsMenu { width: 300px; padding: 14px; }
  #cameoMenu { left: 96px; width: 230px; }
  .set-label { font-size: 12.5px; color: var(--muted); margin: 10px 2px 6px; font-weight: 500; }
  .set-label:first-child { margin-top: 0; }
  .seg { display: flex; padding: 3px; border-radius: 12px; background: rgba(255,255,255,.07); gap: 2px; }
  .seg button { flex: 1; height: 32px; border-radius: 9px; font-size: 13.5px; font-weight: 500; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 5px; padding: 0; }
  .seg button:hover { background: none; color: var(--text); }
  .seg button[aria-pressed="true"] { background: rgba(255,255,255,.16); color: var(--text); }
  .seg .pro { font-size: 9.5px; font-weight: 700; padding: 1px 4px; border-radius: 4px; background: rgba(255,255,255,.14); }
  #cameoMenu button .avatar { width: 26px; height: 26px; font-size: 12px; }
  #cameoMenu button { justify-content: flex-start; }
  #cameoMenu button svg { margin-left: auto; }

  /* ---------- drawer, storyboard, toast ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 60; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; inset: 0 0 0 auto; width: min(400px, 100vw); background: var(--surface); border-left: 1px solid var(--line); z-index: 61; transform: translateX(100%); transition: transform .28s var(--ease); display: flex; flex-direction: column; }
  .drawer.open { transform: none; }
  .d-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 18px 12px; font-weight: 600; font-size: 16px; }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .icon-btn svg { width: 20px; height: 20px; }
  .d-body { flex: 1; overflow-y: auto; padding: 4px 18px; }
  .cmt { display: flex; gap: 10px; padding: 10px 0; }
  .cmt .avatar { width: 34px; height: 34px; font-size: 14px; }
  .cmt b { font-size: 13.5px; font-weight: 600; }
  .cmt b span { color: var(--faint); font-weight: 400; margin-left: 6px; }
  .cmt p { font-size: 14.5px; }
  .d-foot { padding: 12px 18px 18px; }
  .d-foot .search { max-width: none; }

  .sb { position: fixed; left: 50%; top: 50%; translate: -50% -50%; width: min(820px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 24px; z-index: 61; padding: 20px; opacity: 0; pointer-events: none; scale: .97; transition: .2s var(--ease); }
  .sb.open { opacity: 1; pointer-events: auto; scale: 1; }
  .sb-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .sb-head h2 { font-size: 18px; font-weight: 600; }
  .sb-head .beta { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; padding: 2px 7px; border-radius: 6px; background: var(--surface-3); color: var(--muted); }
  .sb-head .icon-btn { margin-left: auto; }
  .cards { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
  .card { flex: 0 0 210px; background: var(--surface-2); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .card header { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .card textarea { background: none; border: 0; outline: 0; resize: none; color: var(--text); font: inherit; font-size: 14px; height: 120px; }
  .card textarea::placeholder { color: var(--faint); }
  .card.add { align-items: center; justify-content: center; border: 1px dashed rgba(255,255,255,.2); background: none; color: var(--muted); cursor: pointer; min-height: 170px; flex-basis: 120px; }
  .card.add:hover { color: var(--text); border-color: rgba(255,255,255,.4); }
  .timeline { position: relative; height: 34px; margin: 16px 4px 18px; }
  .timeline::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 4px; border-radius: 4px; background: var(--surface-3); }
  .timeline i { position: absolute; top: 4px; width: 16px; height: 16px; border-radius: 50%; background: #fff; translate: -50% 0; }
  .timeline span { position: absolute; top: 22px; font-size: 11px; color: var(--faint); translate: -50% 0; }
  .sb-foot { display: flex; justify-content: flex-end; gap: 8px; }

  .toast { position: fixed; left: 50%; bottom: 150px; translate: -50% 12px; z-index: 80; background: #fff; color: #000; font-weight: 600; font-size: 14px; padding: 10px 16px; border-radius: 999px; opacity: 0; pointer-events: none; transition: .22s var(--ease); display: flex; gap: 10px; align-items: center; }
  .toast.open { opacity: 1; translate: -50% 0; pointer-events: auto; }
  .toast button { text-decoration: underline; font-weight: 600; color: #000; }
  .disclaimer { position: fixed; right: 12px; bottom: 6px; z-index: 20; font-size: 10.5px; color: rgba(255,255,255,.28); pointer-events: none; }

  @media (max-width: 700px) {
    :root { --rail: 0px; }
    .rail { inset: auto 0 0 0; width: auto; height: 58px; flex-direction: row; padding: 0 8px; background: rgba(0,0,0,.92); border-top: 1px solid var(--line); justify-content: space-around; }
    .logo, .rail-foot, .nav button::after { display: none; }
    .nav { flex-direction: row; justify-content: space-around; width: 100%; }
    main { bottom: 58px; }
    .composer-wrap { bottom: 68px; padding: 0 10px; }
    .slide { padding: 62px 8px 128px; gap: 0; }
    .player { max-width: 100%; }
    .meta { padding-right: 76px; }
    #cameoBtn { font-size: 0; gap: 0; }
    .actions { position: absolute; right: 16px; bottom: 150px; z-index: 6; gap: 10px; }
    .act span { background: rgba(0,0,0,.4); backdrop-filter: blur(10px); width: 44px; height: 44px; }
    .act { color: #fff; text-shadow: 0 1px 4px #000; }
    .slide { position: relative; }
    .stepper, .disclaimer { display: none; }
    .scroll { padding: 0 12px 190px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 3px; }
    .c-btn.outlined b { display: none; }
    .toast { bottom: 200px; }
    #cameoMenu { left: 8px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>

<aside class="rail">
  <div class="logo" aria-label="Sora">
    <svg viewBox="0 0 36 36"><path fill="#fff" d="M18 3.2c2.5 0 4.7 1.2 6.1 3.1 2.3-.3 4.7.6 6.3 2.4 1.6 1.9 2.1 4.3 1.5 6.6 1.4 1.8 1.9 4.3 1.1 6.6-.8 2.3-2.7 4-5 4.6-.9 2.2-2.8 3.8-5.2 4.3-2.4.5-4.8-.3-6.4-2-2.3.4-4.7-.4-6.3-2.3-1.6-1.8-2.2-4.3-1.6-6.5-1.4-1.9-1.8-4.3-1-6.6.8-2.3 2.6-4 4.9-4.7.9-2.1 2.8-3.7 5.2-4.2.8-.9 1.6-1.3 2.4-1.3Z"/><ellipse cx="13.6" cy="17.6" rx="1.9" ry="3.1" fill="#000"/><ellipse cx="22.4" cy="17.6" rx="1.9" ry="3.1" fill="#000"/></svg>
  </div>
  <nav class="nav" aria-label="Primary">
    <button data-view="home" data-tip="Home" aria-label="Home" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5h-3.5v-6h-6v6H5.500A1.5 1.5 0 0 1 4 19z"/></svg></button>
    <button data-view="explore" data-tip="Explore" aria-label="Explore"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg></button>
    <button data-view="activity" data-tip="Activity" aria-label="Activity"><svg viewBox="0 0 24 24"><path d="M6 16.500V11a6 6 0 1 1 12 0v5.500l1.500 2h-15z"/><path d="M10 21h4"/></svg><i class="dot"></i></button>
    <button data-view="drafts" data-tip="Drafts" aria-label="Drafts"><svg viewBox="0 0 24 24"><rect x="4" y="6.500" width="13" height="14" rx="3"/><path d="M8 3.500h9a3 3 0 0 1 3 3V17"/></svg></button>
    <button data-view="profile" data-tip="Profile" aria-label="Profile"><span class="avatar" style="width:28px;height:28px;font-size:13px;background:#ffd166">Y</span></button>
  </nav>
  <div class="rail-foot">
    <button data-tip="Settings" aria-label="Settings" id="moreBtn"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.200" fill="currentColor"/><circle cx="12" cy="12" r="1.200" fill="currentColor"/><circle cx="19" cy="12" r="1.200" fill="currentColor"/></svg></button>
  </div>
</aside>

<main>
  <!-- HOME -->
  <section class="view on" id="v-home">
    <div class="feed-switch">
      <button class="pill-btn" id="feedBtn" aria-haspopup="menu"><span id="feedLabel">For you</span><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="menu" id="feedMenu" role="menu"></div>
    </div>
    <div class="feed" id="feed" tabindex="0" aria-label="Video feed"></div>
    <div class="stepper">
      <button id="prev" aria-label="Previous video"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg></button>
      <button id="next" aria-label="Next video"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
    </div>
  </section>

  <!-- EXPLORE -->
  <section class="view" id="v-explore"><div class="scroll">
    <div class="page-head">
      <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.500"/><path d="m20 20-4.200-4.200"/></svg><input id="q" placeholder="Search" autocomplete="off"></label>
    </div>
    <div class="tabs" id="exploreTabs" style="margin-bottom:14px"></div>
    <div class="grid" id="exploreGrid"></div>
  </div></section>

  <!-- ACTIVITY -->
  <section class="view" id="v-activity"><div class="scroll">
    <div class="page-head"><h1>Activity</h1></div>
    <div id="notifs"></div>
  </div></section>

  <!-- DRAFTS -->
  <section class="view" id="v-drafts"><div class="scroll">
    <div class="page-head"><h1>Drafts</h1></div>
    <div class="grid" id="draftGrid"></div>
  </div></section>

  <!-- PROFILE -->
  <section class="view" id="v-profile"><div class="scroll">
    <div class="profile-top">
      <span class="avatar" style="background:#ffd166">Y</span>
      <h1>you</h1>
      <div class="stats"><div><b>128</b>Followers</div><div><b>64</b>Following</div><div><b>3.2K</b>Likes</div></div>
      <p>Making tiny impossible films.</p>
      <div style="display:flex;gap:8px"><button class="btn">Edit profile</button><button class="btn">Share profile</button></div>
    </div>
    <div class="center"><div class="tabs" id="profileTabs"></div></div>
    <div class="grid" id="profileGrid"></div>
  </div></section>
</main>

<!-- COMPOSER -->
<div class="composer-wrap">
  <form class="composer" id="composer">
    <div class="cameo-row" id="cameoRow"></div>
    <textarea id="prompt" rows="1" placeholder="Describe new video..." aria-label="Describe new video"></textarea>
    <div class="c-row">
      <button type="button" class="c-btn" id="attachBtn" aria-label="Add image"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button type="button" class="c-btn" id="settingsBtn" aria-label="Settings" aria-haspopup="true"><svg viewBox="0 0 24 24"><path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2"/><circle cx="9" cy="16" r="2"/></svg><span id="settingsSummary">Portrait · 10s</span></button>
      <button type="button" class="c-btn" id="cameoBtn" aria-label="Add cameo" aria-haspopup="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="3.500"/><path d="M5 20c.800-3.500 3.600-5.500 7-5.500s6.200 2 7 5.500"/></svg>Cameo</button>
      <button type="button" class="c-btn outlined" id="sbBtn"><svg viewBox="0 0 24 24"><rect x="3.500" y="6" width="7" height="12" rx="2"/><rect x="13.500" y="6" width="7" height="12" rx="2"/></svg><b style="font-weight:500">Storyboard</b><span class="pro">PRO</span></button>
      <button class="send" id="send" aria-label="Create video" disabled><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
    </div>

    <div class="menu" id="settingsMenu">
      <div class="set-label">Model</div>
      <div class="seg" data-key="model"><button type="button" data-v="Sora 2">Sora 2</button><button type="button" data-v="Sora 2 Pro">Sora 2 Pro <span class="pro">PRO</span></button></div>
      <div class="set-label">Orientation</div>
      <div class="seg" data-key="orientation"><button type="button" data-v="Portrait">Portrait</button><button type="button" data-v="Landscape">Landscape</button></div>
      <div class="set-label">Duration</div>
      <div class="seg" data-key="duration"><button type="button" data-v="10s">10s</button><button type="button" data-v="15s">15s</button><button type="button" data-v="25s">25s <span class="pro">PRO</span></button></div>
    </div>
    <div class="menu" id="cameoMenu" role="menu"></div>
  </form>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Comments">
  <div class="d-head"><span id="cmtTitle">Comments</span><button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="d-body" id="cmtBody"></div>
  <form class="d-foot" id="cmtForm"><label class="search"><input id="cmtInput" placeholder="Add a comment..." autocomplete="off"></label></form>
</aside>

<section class="sb" id="sb" aria-label="Storyboard">
  <div class="sb-head"><h2>Storyboard</h2><span class="beta">BETA</span><button class="icon-btn" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="cards" id="cards"></div>
  <div class="timeline" id="timeline"></div>
  <div class="sb-foot"><button class="btn" data-close>Cancel</button><button class="btn primary" id="sbCreate">Create</button></div>
</section>

<div class="toast" id="toast"><span></span><button hidden>View</button></div>
<div class="disclaimer">Unofficial reconstruction · placeholder content · not affiliated with OpenAI</div>

<script>
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const I = {
  heart: '<svg viewBox="0 0 24 24"><path d="M12 20s-7.500-4.600-7.500-10.200A4.300 4.300 0 0 1 12 7.300a4.300 4.300 0 0 1 7.500 2.500C19.500 15.400 12 20 12 20Z"/></svg>',
  comment: '<svg viewBox="0 0 24 24"><path d="M20 11.500a8 8 0 0 1-11.700 7.100L4 20l1.400-4.100A8 8 0 1 1 20 11.500Z"/></svg>',
  remix: '<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.300M20 4v4h-4M20 12a8 8 0 0 1-14 5.300M4 20v-4h4"/></svg>',
  share: '<svg viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>',
  more: '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.200" fill="currentColor"/><circle cx="12" cy="12" r="1.200" fill="currentColor"/><circle cx="19" cy="12" r="1.200" fill="currentColor"/></svg>',
  check: '<svg viewBox="0 0 24 24"><path d="m5 12.500 4.500 4.500L19 7.500"/></svg>',
  x: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  play: '<svg viewBox="0 0 24 24"><path d="M8 5.500v13l11-6.500z"/></svg>',
  plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
};
const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.0', '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1).replace('.0', '') + 'K' : '' + n;
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const hue = s => [...s].reduce((a, c) => a + c.charCodeAt(0) * 7, 0) % 360;
const avatar = (u, size) => `<span class="avatar" style="background:hsl(${hue(u)} 80% 70%)${size ? `;width:${size}px;height:${size}px` : ''}">${u[0].toUpperCase()}</span>`;
const scene = p => `<div class="scene" style="background:${p[3] || '#050505'}"><i style="background:${p[0]}"></i><i style="background:${p[1]}"></i><i style="background:${p[2]}"></i></div><div class="grain"></div>`;

/* invented placeholder content */
const posts = [
  { u: 'mossgarden', c: 'A capybara running a tiny ramen stall in the rain, steam curling under paper lanterns', l: 48200, m: 912, r: 340, p: ['#ff7a3d', '#ffcf5c', '#7a1f5c', '#1a0b14'], cam: [] },
  { u: 'lowtide.fm', c: 'POV: surfing a wave made entirely of glass marbles at golden hour', l: 127400, m: 2301, r: 1180, p: ['#19c2ff', '#ffe08a', '#0b4dff', '#04122b'], cam: ['juno'] },
  { u: 'paper_owl', c: 'Stop-motion felt astronauts planting a garden on a very small moon', l: 9120, m: 188, r: 73, p: ['#b388ff', '#5cf2c2', '#2b1a6b', '#0a0718'], cam: [] },
  { u: 'kiln', c: 'A figure skater carving glowing trails across a frozen city rooftop at night', l: 310900, m: 5544, r: 2207, p: ['#ff3b8d', '#5ce1ff', '#3a0ca3', '#070314'], cam: ['juno', 'beck'] },
  { u: 'slowweather', c: 'Thunderstorm inside a teacup, macro lens, the spoon is a lighthouse', l: 22050, m: 407, r: 219, p: ['#8ecae6', '#f1faee', '#264653', '#061016'], cam: [] },
  { u: 'beck', c: 'Me and a golden retriever co-hosting a late night talk show, 1970s film stock', l: 64300, m: 1320, r: 498, p: ['#ffb703', '#fb5607', '#8338ec', '#160a05'], cam: ['beck'] },
  { u: 'northfold', c: 'Origami cranes migrating over a desert highway, drone shot at dawn', l: 15800, m: 266, r: 141, p: ['#ffd6a5', '#ff9770', '#70d6ff', '#1a0f0a'], cam: [] },
  { u: 'juno', c: 'Underwater ballroom, jellyfish chandeliers, everyone dancing in slow motion', l: 88700, m: 1702, r: 760, p: ['#00f5d4', '#9b5de5', '#00296b', '#02081a'], cam: ['juno'] },
];
const more = [
  ['fernandsalt', 'Miniature train crossing a breakfast table', ['#f4a261', '#e9c46a', '#2a9d8f', '#0e0b06']],
  ['quietpixel', 'Neon koi swimming through a subway car', ['#ff006e', '#3a86ff', '#8338ec', '#05030f']],
  ['mossgarden', 'A fox librarian shelving clouds', ['#ffcad4', '#b8e0d2', '#6b4e71', '#120b12']],
  ['halfmoon', 'Lava lamp city skyline timelapse', ['#f72585', '#ffbe0b', '#7209b7', '#0c0312']],
  ['paper_owl', 'Clay penguins learning to skateboard', ['#caf0f8', '#48cae4', '#03045e', '#020814']],
  ['kiln', 'A violin made of water playing itself', ['#90e0ef', '#e0aaff', '#240046', '#06020f']],
  ['northfold', 'Hot air balloons shaped like fruit', ['#ff595e', '#ffca3a', '#8ac926', '#0f0a04']],
  ['slowweather', 'Snow falling upward in a pine forest', ['#d8f3dc', '#74c69d', '#1b4332', '#030a06']],
].map(([u, c, p], i) => ({ u, c, p, l: 900 + i * 3711 % 40000, m: 12 + i * 37, r: 4 + i * 9, cam: [] }));
const all = [...posts, ...more];
const cameos = ['you', 'juno', 'beck'];
const state = { feed: 'For you', model: 'Sora 2', orientation: 'Portrait', duration: '10s', cameo: [], idx: 0 };
const drafts = [
  { prompt: 'A lighthouse keeper teaching seagulls to waltz', p: ['#ffd166', '#06d6a0', '#118ab2', '#04121a'], done: 100, dur: '10s' },
  { prompt: 'Tiny dragons roasting marshmallows on a windowsill', p: ['#ef476f', '#ffd166', '#5f0f40', '#14050c'], done: 100, dur: '15s' },
];

/* ----- feed ----- */
const feed = $('#feed');
function slide(p, i) {
  return `<article class="slide" data-i="${i}">
    <div class="player" tabindex="0" role="button" aria-label="Play or pause video by ${p.u}">
      ${scene(p.p)}<div class="shade"></div>
      <div class="play-ind"><span>${I.play}</span></div>
      <div class="meta">
        <div class="who">${avatar(p.u, 34)}<b>${p.u}</b><button class="follow">Follow</button></div>
        <p class="caption">${esc(p.c)}</p>
        ${p.cam.length ? `<div class="chips">${p.cam.map(c => `<span class="chip">${avatar(c)}${c}</span>`).join('')}</div>` : ''}
      </div>
      <div class="progress"><i></i></div>
    </div>
    <div class="actions">
      <button class="act like" aria-label="Like"><span>${I.heart}</span><em style="font-style:normal">${fmt(p.l)}</em></button>
      <button class="act cmt-open" aria-label="Comments"><span>${I.comment}</span>${fmt(p.m)}</button>
      <button class="act remix" aria-label="Remix"><span>${I.remix}</span>${fmt(p.r)}</button>
      <button class="act share" aria-label="Share"><span>${I.share}</span>Share</button>
      <button class="act" aria-label="More"><span>${I.more}</span></button>
    </div>
  </article>`;
}
let order = posts.map((_, i) => i);
function renderFeed() {
  feed.innerHTML = order.map(i => slide(posts[i], i)).join('');
  feed.scrollTop = 0; setActive(0);
}
function setActive(n) {
  state.idx = n;
  $$('.slide', feed).forEach((s, k) => s.classList.toggle('active', k === n));
  $('#prev').disabled = n === 0; $('#next').disabled = n === order.length - 1;
}
feed.addEventListener('scroll', () => { const n = Math.round(feed.scrollTop / feed.clientHeight); if (n !== state.idx) setActive(n); });
const go = d => feed.scrollTo({ top: (state.idx + d) * feed.clientHeight, behavior: 'smooth' });
$('#prev').onclick = () => go(-1); $('#next').onclick = () => go(1);
feed.addEventListener('click', e => {
  const s = e.target.closest('.slide'); if (!s) return; const p = posts[+s.dataset.i];
  const like = e.target.closest('.like'), fol = e.target.closest('.follow');
  if (like) { p.liked = !p.liked; p.l += p.liked ? 1 : -1; like.classList.toggle('liked', p.liked); $('em', like).textContent = fmt(p.l); }
  else if (fol) { fol.classList.toggle('on'); fol.textContent = fol.classList.contains('on') ? 'Following' : 'Follow'; }
  else if (e.target.closest('.cmt-open')) openComments(p);
  else if (e.target.closest('.remix')) { $('#prompt').value = 'Remix: ' + p.c; syncPrompt(); $('#prompt').focus(); }
  else if (e.target.closest('.share')) toast('Link copied');
  else if (e.target.closest('.player')) e.target.closest('.player').classList.toggle('paused');
});
feed.addEventListener('dblclick', e => { const s = e.target.closest('.slide'); if (s && e.target.closest('.player') && !posts[+s.dataset.i].liked) { $('.like', s).click(); $('.player', s).classList.remove('paused'); } });

/* ----- feed switcher ----- */
const feeds = ['For you', 'Following', 'Top', 'Latest'];
$('#feedMenu').innerHTML = feeds.map(f => `<button role="menuitemradio" aria-checked="${f === state.feed}" data-f="${f}">${f}${I.check}</button>`).join('');
$('#feedMenu').onclick = e => {
  const b = e.target.closest('button'); if (!b) return; state.feed = b.dataset.f; $('#feedLabel').textContent = state.feed;
  $$('#feedMenu button').forEach(x => x.setAttribute('aria-checked', x === b));
  const idx = posts.map((_, i) => i);
  order = state.feed === 'Top' ? idx.sort((a, b) => posts[b].l - posts[a].l) : state.feed === 'Latest' ? idx.reverse() : state.feed === 'Following' ? idx.filter(i => i % 2) : idx;
  renderFeed(); closeMenus();
};

/* ----- menus ----- */
const closeMenus = () => $$('.menu.open').forEach(m => m.classList.remove('open'));
const bindMenu = (btn, menu) => $(btn).addEventListener('click', e => { e.stopPropagation(); const m = $(menu), was = m.classList.contains('open'); closeMenus(); m.classList.toggle('open', !was); });
bindMenu('#feedBtn', '#feedMenu'); bindMenu('#settingsBtn', '#settingsMenu'); bindMenu('#cameoBtn', '#cameoMenu');
document.addEventListener('click', e => { if (!e.target.closest('.menu')) closeMenus(); });

/* ----- tiles ----- */
const tile = (p, badge) => `<div class="tile" tabindex="0" data-u="${p.u}">${scene(p.p)}${badge ? `<span class="badge">${badge}</span>` : ''}<div class="tile-meta">${avatar(p.u)}${p.u}<em>${I.heart}${fmt(p.l)}</em></div></div>`;
const tabs = (el, names, on) => { el.innerHTML = names.map((n, i) => `<button class="tab" role="tab" aria-selected="${i === 0}">${n}</button>`).join(''); el.onclick = e => { const b = e.target.closest('.tab'); if (!b) return; $$('.tab', el).forEach(t => t.setAttribute('aria-selected', t === b)); on(b.textContent); }; };
function renderExplore(tab = 'Top', q = '') {
  let list = [...all]; if (tab === 'Latest') list.reverse(); if (tab === 'Top') list.sort((a, b) => b.l - a.l);
  if (tab === 'Cameos') list = list.filter(p => p.cam.length);
  if (q) list = list.filter(p => (p.c + p.u).toLowerCase().includes(q.toLowerCase()));
  $('#exploreGrid').innerHTML = list.map(p => tile(p)).join('') || '<p class="empty" style="grid-column:1/-1">No results</p>';
}
let exTab = 'Top';
tabs($('#exploreTabs'), ['Top', 'Latest', 'Cameos'], t => { exTab = t; renderExplore(t, $('#q').value); });
$('#q').oninput = e => renderExplore(exTab, e.target.value);
function renderProfile(tab = 'Posts') {
  const list = tab === 'Posts' ? more.slice(0, 5) : tab === 'Cameos' ? posts.filter(p => p.cam.length) : posts.filter(p => p.liked);
  $('#profileGrid').innerHTML = list.map(p => tile(tab === 'Posts' ? { ...p, u: 'you' } : p)).join('') || `<p class="empty" style="grid-column:1/-1">${tab === 'Likes' ? 'Videos you like will appear here' : 'Nothing here yet'}</p>`;
}
tabs($('#profileTabs'), ['Posts', 'Cameos', 'Likes'], renderProfile);

/* ----- drafts ----- */
const C = 2 * Math.PI * 28;
function renderDrafts() {
  $('#draftGrid').innerHTML = drafts.map((d, i) => d.done < 100
    ? `<div class="tile gen" data-d="${i}"><div class="ring"><svg viewBox="0 0 62 62"><circle cx="31" cy="31" r="28"/><circle cx="31" cy="31" r="28" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - d.done / 100)}"/></svg><span>${Math.round(d.done)}%</span></div><p>${esc(d.prompt)}</p></div>`
    : `<div class="tile" tabindex="0">${scene(d.p)}<span class="badge">${d.dur}</span><div class="tile-meta" style="font-weight:400"><span style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(d.prompt)}</span></div></div>`).join('')
    || '<p class="empty" style="grid-column:1/-1">Your drafts will appear here</p>';
}
function generate(prompt) {
  const h = hue(prompt), d = { prompt, p: [`hsl(${h} 90% 60%)`, `hsl(${(h + 70) % 360} 90% 65%)`, `hsl(${(h + 200) % 360} 80% 40%)`, '#07070c'], done: 0, dur: state.duration };
  drafts.unshift(d); renderDrafts();
  toast('Added to drafts', () => show('drafts'));
  const t = setInterval(() => { d.done = Math.min(100, d.done + 3 + Math.random() * 6); renderDrafts(); if (d.done >= 100) { clearInterval(t); toast('Your video is ready', () => show('drafts')); } }, 450);
}

/* ----- activity ----- */
$('#notifs').innerHTML = [
  ['juno', 'liked your video', '2m', 0], ['kiln', 'remixed your video', '18m', 3], ['paper_owl', 'started following you', '1h'],
  ['beck', 'used your cameo in a draft', '3h', 5], ['lowtide.fm', 'commented: "the lighting here is unreal"', '5h', 1], ['mossgarden', 'liked your video', '1d', 2],
].map(([u, t, w, k]) => `<div class="notif">${avatar(u)}<p><b>${u}</b> ${esc(t)} <span>· ${w}</span></p>${k != null ? `<div class="thumb">${scene(more[k].p)}</div>` : '<button class="btn primary" style="height:32px">Follow</button>'}</div>`).join('');

/* ----- routing ----- */
function show(v) {
  $$('.view').forEach(x => x.classList.toggle('on', x.id === 'v-' + v));
  $$('.nav button').forEach(b => b.dataset.view === v ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  if (v === 'activity') $('.dot')?.remove(); if (v === 'profile') renderProfile($('#profileTabs [aria-selected="true"]').textContent);
  $('.stepper').style.display = v === 'home' ? '' : 'none';
}
$('.nav').onclick = e => { const b = e.target.closest('button'); if (b) show(b.dataset.view); };
$('#moreBtn').onclick = () => toast('Settings are not part of this reconstruction');
document.addEventListener('click', e => { const t = e.target.closest('.grid .tile:not(.gen)'); if (t && t.dataset.u) { const i = posts.findIndex(p => p.u === t.dataset.u); if (i >= 0) { show('home'); const n = order.indexOf(i); if (n >= 0) feed.scrollTo({ top: n * feed.clientHeight }); } } });

/* ----- composer ----- */
const ta = $('#prompt');
function syncPrompt() { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 140) + 'px'; $('#send').disabled = !ta.value.trim(); }
ta.addEventListener('input', syncPrompt);
ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#composer').requestSubmit(); } });
$('#composer').addEventListener('submit', e => { e.preventDefault(); const v = ta.value.trim(); if (!v) return; generate(v); ta.value = ''; syncPrompt(); });
function syncSettings() {
  $$('.seg').forEach(s => $$('button', s).forEach(b => b.setAttribute('aria-pressed', b.dataset.v === state[s.dataset.key])));
  $('#settingsSummary').textContent = `${state.orientation} · ${state.duration}${state.model === 'Sora 2 Pro' ? ' · Pro' : ''}`;
}
$('#settingsMenu').onclick = e => { e.stopPropagation(); const b = e.target.closest('.seg button'); if (b) { state[b.parentNode.dataset.key] = b.dataset.v; syncSettings(); } };
function syncCameo() {
  $('#cameoMenu').innerHTML = cameos.map(c => `<button type="button" role="menuitemcheckbox" aria-checked="${state.cameo.includes(c)}" data-c="${c}">${avatar(c)}${c === 'you' ? 'You' : c}${I.check}</button>`).join('');
  $('#cameoRow').innerHTML = state.cameo.map(c => `<span class="chip">${avatar(c)}${c === 'you' ? 'You' : c}<button type="button" data-c="${c}" aria-label="Remove ${c}">${I.x}</button></span>`).join('');
}
const toggleCameo = c => { state.cameo = state.cameo.includes(c) ? state.cameo.filter(x => x !== c) : [...state.cameo, c]; syncCameo(); };
$('#cameoMenu').onclick = e => { e.stopPropagation(); const b = e.target.closest('button'); if (b) toggleCameo(b.dataset.c); };
$('#cameoRow').onclick = e => { const b = e.target.closest('button'); if (b) toggleCameo(b.dataset.c); };
$('#attachBtn').onclick = () => toast('Image upload is not part of this reconstruction');

/* ----- comments ----- */
const lines = ['how is this even real', 'the lighting here is unreal', 'remixing this immediately', 'need a 25s version', 'the sound design 😭', 'ok this one got me', 'prompt please'];
function openComments(p) {
  $('#cmtTitle').textContent = `${fmt(p.m)} comments`;
  $('#cmtBody').innerHTML = lines.map((t, i) => { const u = all[(i * 3 + p.u.length) % all.length].u; return `<div class="cmt">${avatar(u)}<div><b>${u}<span>${i + 1}h</span></b><p>${t}</p></div></div>`; }).join('');
  open('#drawer');
}
$('#cmtForm').onsubmit = e => { e.preventDefault(); const v = $('#cmtInput').value.trim(); if (!v) return; $('#cmtBody').insertAdjacentHTML('afterbegin', `<div class="cmt">${avatar('you')}<div><b>you<span>now</span></b><p>${esc(v)}</p></div></div>`); $('#cmtInput').value = ''; };

/* ----- storyboard ----- */
let cards = [];
const total = () => parseInt(state.duration);
function renderSB() {
  const step = total() / cards.length;
  $('#cards').innerHTML = cards.map((c, i) => `<div class="card"><header><span>${+(i * step).toFixed(1)}s</span>${cards.length > 1 ? `<button class="icon-btn" style="width:24px;height:24px" data-rm="${i}" aria-label="Remove card">${I.x}</button>` : ''}</header><textarea data-i="${i}" placeholder="Describe this moment...">${esc(c)}</textarea></div>`).join('') + (cards.length < 5 ? `<button class="card add" id="addCard" aria-label="Add card">${I.plus}</button>` : '');
  $('#timeline').innerHTML = cards.map((_, i) => `<i style="left:${i * step / total() * 100}%"></i><span style="left:${i * step / total() * 100}%">${+(i * step).toFixed(1)}s</span>`).join('') + `<span style="left:100%">${total()}s</span>`;
}
$('#sbBtn').onclick = () => { cards = [ta.value.trim(), '']; renderSB(); open('#sb'); };
$('#cards').addEventListener('input', e => { if (e.target.dataset.i) cards[+e.target.dataset.i] = e.target.value; });
$('#cards').addEventListener('click', e => { const rm = e.target.closest('[data-rm]'); if (rm) { cards.splice(+rm.dataset.rm, 1); renderSB(); } else if (e.target.closest('#addCard')) { cards.push(''); renderSB(); } });
$('#sbCreate').onclick = () => { const v = cards.map(c => c.trim()).filter(Boolean); if (!v.length) return toast('Add a description to at least one card'); closeAll(); generate(v.join(' → ')); ta.value = ''; syncPrompt(); };

/* ----- overlays ----- */
const open = s => { $(s).classList.add('open'); $('#scrim').classList.add('open'); };
const closeAll = () => $$('.drawer, .sb, .scrim').forEach(x => x.classList.remove('open'));
$('#scrim').onclick = closeAll; $$('[data-close]').forEach(b => b.onclick = closeAll);
let tt; function toast(msg, action) {
  const t = $('#toast'); $('span', t).textContent = msg; const b = $('button', t); b.hidden = !action; b.onclick = () => { action(); t.classList.remove('open'); };
  t.classList.add('open'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('open'), 3200);
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeAll(); closeMenus(); return; }
  if (/INPUT|TEXTAREA/.test(document.activeElement.tagName) || !$('#v-home').classList.contains('on')) return;
  if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); go(1); }
  if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); go(-1); }
  if (e.key === ' ') { e.preventDefault(); $('.slide.active .player')?.classList.toggle('paused'); }
  if (e.key === 'l') $('.slide.active .like')?.click();
});

renderFeed(); renderExplore(); renderDrafts(); renderProfile(); syncSettings(); syncCameo(); show('home');
</script>
</body>
</html>
